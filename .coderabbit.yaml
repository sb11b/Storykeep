# Quiet CodeRabbit setup for sb11b/Storykeep-.
# Reviews pull requests into main. No Slack, no summaries, no poems, no auto-approve.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  path_filters:
    - "!**/.venv/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/*.lock"
  path_instructions:
    - path: "**"
      instructions: |
        Report bugs that change behavior, lose data, or break auth. Skip style.
        A high-severity finding drops user text, exposes a private route, prints a secret, or pushes to main.
        Adding to a note keeps the original text. /api/v1/junior stays behind require_user. Demo gets 403.
        No DROP TABLE. Do not change the owner email. Do not print secrets or DATABASE_URL.
        Do not merge the pull request. Bugbot is off. Do not comment "bugbot run".
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  art: false
  auto_reply: false
